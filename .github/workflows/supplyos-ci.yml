name: SupplyOS verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  mobile:
    name: ${{ matrix.name }} TypeScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Owner
            directory: mobile-admin
          - name: Manager
            directory: mobile-manager
          - name: Employee
            directory: mobile-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        working-directory: ${{ matrix.directory }}
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck
